# Deploy public landing site from main (docs/ subset only).
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/about.html"
      - "docs/site.json"
      - "docs/FEATURES.md"
      - "docs/downloads/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site only
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          cp docs/index.html docs/about.html docs/site.json docs/FEATURES.md _site/
          cp -r docs/downloads/. _site/downloads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4