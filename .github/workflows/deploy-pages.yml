# Deploy public landing site from main (docs/ subset only).
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/about.html"
      - "docs/site.json"
      - "docs/metrics.json"
      - "docs/site-metrics.js"
      - "docs/FEATURES.md"
      - "docs/wheel-hero.js"
      - "docs/wheel-audio.js"
      - "docs/wheel-audio-3.js"
      - "docs/wheel-audio-4.js"
      - "docs/wheel-audio-5.js"
      - "docs/downloads/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh metrics snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="avinashpeyyety/nakshatra"
          STARS=$(gh api "repos/$REPO" --jq '.stargazers_count')
          FORKS=$(gh api "repos/$REPO" --jq '.forks_count')
          VIEWS=$(gh api "repos/$REPO/traffic/views" --jq '[.views[].count] | add // 0')
          CLONES=$(gh api "repos/$REPO/traffic/clones" --jq '[.clones[].count] | add // 0')
          UPDATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > docs/metrics.json <<EOF
          {
            "updatedAt": "$UPDATED",
            "stars": $STARS,
            "forks": $FORKS,
            "repoViews14d": $VIEWS,
            "repoClones14d": $CLONES
          }
          EOF
      - name: Assemble public site only
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          cp docs/index.html docs/about.html docs/site.json docs/metrics.json docs/site-metrics.js docs/FEATURES.md docs/wheel-hero.js docs/wheel-audio*.js _site/
          cp -r docs/downloads/. _site/downloads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
