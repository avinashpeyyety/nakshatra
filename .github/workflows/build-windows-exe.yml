# Build Windows .exe (PyInstaller). Download artifact locally or use release-desktop.yml.
name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller>=6.0

      - name: Build exe
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --noconfirm scripts/nakshatra-chakram.spec
          $v = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/out | Out-Null
          Move-Item -Force "dist/nakshatra-chakram.exe" "dist/out/nakshatra-chakram-$v-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ inputs.version }}
          path: dist/out/nakshatra-chakram-${{ inputs.version }}-windows.exe
          if-no-files-found: error