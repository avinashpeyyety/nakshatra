<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nakshatra Chakram — 108-Pada Cosmic Transit Dial</title>
  <meta name="description" content="Enigmatic 108-Pada Vedic Jyotish cosmic dial with built-in Chitrapaksha (Lahiri) & B.V. Raman ayanamsas, interactive concentric Vimshottari Dasha dials, Drishti optical lenses, Sade Sati epochs, real lunar phases & eclipses, and D1–D60 Multi-Varga Triple Transit alerts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cosmic-dial.css?v=11" />
</head>
<body class="is-zen">
  <canvas id="celestialTapestry" class="celestial-tapestry" aria-hidden="true"></canvas>

  <!-- Subtle Floating Observatory Crest -->
  <div class="zen-crest" aria-label="Nakshatra Chakram Observatory">
    <span class="brand-sigil" aria-hidden="true">☸</span>
    <div class="zen-crest-copy">
      <span class="zen-crest-title">Nakshatra Chakram</span>
      <span class="zen-crest-sub">108-Pada Sidereal Observatory</span>
    </div>
  </div>

  <!-- Fullscreen Cosmic Dial Stage -->
  <main class="cosmic-hero">
    <div class="dial-stage">
      <canvas id="cosmicDialCanvas" aria-label="Interactive 108-Pada Cosmic Transit Dial. Hover rings to inspect; drag to crank time; click to pin lore."></canvas>

      <!-- Click-to-Pin Compact Lore Card (top-left below crest; never appears on hover) -->
      <div id="pinned-lore" class="pinned-lore" hidden>
        <button id="pinned-lore-close" class="pinned-lore-close" type="button" aria-label="Close lore card">✕</button>
        <div id="pinned-lore-body"></div>
      </div>
    </div>
  </main>

  <!-- Interactive Concentric 3-Ring Vimshottari Dasha Dials Drawer (Right Flank) -->
  <aside id="dasha-panel" class="dasha-panel" aria-label="Vimshottari Dasha Dials" hidden>
    <div class="dasha-panel-head">
      <div class="dasha-panel-title">
        <span aria-hidden="true">☸</span>
        <span>Vimshottari Dasha Dials</span>
      </div>
      <button id="dasha-panel-close" class="pinned-lore-close" type="button" aria-label="Close Dasha Dials">✕</button>
    </div>

    <div class="dasha-canvas-wrap">
      <canvas id="dashaDialCanvas" width="248" height="248" aria-label="Concentric 3-Ring Vimshottari Mahadasha, Antardasha, and Pratyantardasha Dial. Hover to inspect; click any arc to time-travel."></canvas>
    </div>

    <div id="dasha-hover-info" class="dasha-hover-info">
      Outer: Mahadasha · Mid: Antardasha · Inner: PD · Click arc to jump
    </div>

    <div id="dasha-breakdown" class="dasha-breakdown"></div>
    <div id="dasha-epochs" class="dasha-epochs"></div>
  </aside>

  <datalist id="city-list"></datalist>

  <!-- Stabilized Fixed-Geometry Bottom Cosmic Instrument Deck -->
  <div id="zen-dock" class="zen-dock">
    <div id="zen-varga-bar" class="zen-varga-bar" aria-live="polite">
      <span id="zen-varga-text" class="zen-varga-text">Hover any ▼ arrow on timeline for D1–D60 Multi-Varga Triple Transit impact · Click ▼ to jump directly</span>
    </div>

    <div class="zen-timeline-row">
      <span id="zen-tl-start" class="scrubber-tick">1988</span>
      <div class="scrubber-track-wrap zen-track-wrap">
        <div id="zen-triple-markers" class="triple-markers" aria-label="Triple Transit jump markers"></div>
        <div id="zen-epochs" class="timeline-epochs" aria-hidden="true"></div>
        <span id="zen-today-mark" class="today-mark" title="Today"></span>
        <input id="zen-scrubber" type="range" min="0" max="10000" value="5000" aria-label="Lifespan timeline scrubber" />
      </div>
      <span id="zen-tl-end" class="scrubber-tick">2056</span>
    </div>

    <div class="zen-bar-row">
      <span id="zen-date" class="zen-date">-- --- ----</span>
      <div class="zen-born-wrap" title="Click BORN to jump to birth moment; edit date, time &amp; place inline">
        <button id="zen-birth-jump" type="button" class="zen-born-btn" title="Jump dial to exact birth moment">BORN</button>
        <input id="zen-birth-date" class="zen-birth-input" type="date" value="1988-08-15" aria-label="Birth date" />
        <input id="zen-birth-time" class="zen-birth-time" type="time" value="06:30" aria-label="Birth local time" />
        <input id="zen-birth-city" class="zen-birth-city" type="text" list="city-list" value="Hyderabad, India" placeholder="City / lat,lon" aria-label="Birth place" title="Birth place (pick city or enter lat, lon)" />
      </div>
      <span id="zen-meta" class="zen-meta"></span>
      <div class="zen-controls">
        <button id="zen-play" type="button" class="mech-btn mech-btn-xs is-active" title="Play or pause (Space)">❚❚</button>
        <button id="zen-rev" type="button" class="mech-btn mech-btn-xs" title="Toggle time direction">FWD</button>
        <button type="button" class="mech-btn mech-btn-xs" data-speed="day" title="1 day/sec">D</button>
        <button type="button" class="mech-btn mech-btn-xs is-active" data-speed="week" title="1 week/sec">W</button>
        <button type="button" class="mech-btn mech-btn-xs" data-speed="month" title="1 month/sec">M</button>
        <button id="zen-prev-transit" type="button" class="mech-btn mech-btn-xs mech-btn-accent" title="Previous convergence">⏮</button>
        <button id="zen-next-transit" type="button" class="mech-btn mech-btn-xs mech-btn-accent" title="Next convergence">⏭</button>
        <button id="zen-today" type="button" class="mech-btn mech-btn-xs" title="Snap to today">NOW</button>
        <button id="zen-lens" type="button" class="mech-btn mech-btn-xs zen-lens-btn" title="Cycle Drishti Optical Lens: Convergences → All Rays → Natal Resonance (L)">◎ CONV</button>
        <button id="zen-dasha" type="button" class="mech-btn mech-btn-xs zen-dasha-btn" title="Toggle Concentric Vimshottari Dasha Dials (D)">☸ DASHA</button>
        <div class="zen-ayan-seg" role="group" aria-label="Ayanamsa switch">
          <button type="button" class="zen-ayan-btn is-active" data-ayanamsa="lahiri" title="Chitrapaksha (Lahiri) Ayanamsa">CHITRA</button>
          <button type="button" class="zen-ayan-btn" data-ayanamsa="raman" title="B.V. Raman Ayanamsa">RAMAN</button>
        </div>
        <button id="zen-sound" type="button" class="mech-btn mech-btn-xs is-active" title="Toggle Tabla &amp; Tanpura cosmic ambience on/off">🔊</button>
        <button id="zen-theme" type="button" class="mech-btn mech-btn-xs" title="Toggle Day / Night theme">☀</button>
      </div>
    </div>
  </div>

  <script src="jyotish-engine.js?v=11" defer></script>
  <script src="cosmic-audio.js?v=9" defer></script>
  <script src="cosmic-tapestry.js?v=8" defer></script>
  <script src="cosmic-dial.js?v=11" defer></script>
</body>
</html>
